spring:
  application:
    name: archives-bancaires-api
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:archives_bancaires}
    username: ${DB_USERNAME:archives_user}
    password: ${DB_PASSWORD:archives_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: ArchivesHikariPool
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  
  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  
  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Europe/Paris
  
  # Cache Configuration
  cache:
    type: simple
  
  # File Upload
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

# JWT Configuration (Base64 encoded secret - min 256 bits for HS256)
jwt:
  secret: ${JWT_SECRET:dGhpc0lzQVZlcnlMb25nU2VjcmV0S2V5Rm9ySldUVG9rZW5HZW5lcmF0aW9uVGhhdFNob3VsZEJlQXRMZWFzdDI1NkJpdHNMb25nRm9yU2VjdXJpdHlBbmRJc1NlY3VyZQ==}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds
  header: Authorization
  prefix: "Bearer "

# Application Specific Configuration
application:
  security:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  archives:
    default-retention-years: 10
    alert-days-before-expiration: 90
    max-file-size: 52428800 # 50MB
    allowed-file-types: pdf,jpg,jpeg,png,tiff,doc,docx,xls,xlsx,zip
  pagination:
    default-page-size: 20
    max-page-size: 100
  storage:
    upload-dir: ${APP_UPLOAD_DIR:uploads}

# Logging Configuration
logging:
  level:
    root: INFO
    com.banque.archives: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
